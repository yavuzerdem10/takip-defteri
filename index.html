<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24578A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Takip Defteri">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Takip Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{
  /* Kareli defter zemini; öğretmen: solda menü + iş alanı; veli: tek sütun + alt sekme çubuğu */
  --bg:#EEF2F6; --paper:#FFFFFF; --ink:#18212C; --muted:#5A6676; --line:#D8DFE7;
  --accent:#24578A; --accent-ink:#FFFFFF; --accent-soft:#E2EBF5;
  --pencil:#D99A00; --pencil-soft:#FBF0D3;
  --good:#23784A; --good-soft:#DFF1E6; --warn:#9A5A00; --warn-soft:#FAEBD3; --crit:#B3261E; --crit-soft:#F8E0DE;
  --grid:rgba(36,87,138,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --paper:#1A2129; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3641;
    --accent:#7FB0E0; --accent-ink:#0E1620; --accent-soft:#1E3247;
    --pencil:#F0BE3A; --pencil-soft:#352A0F;
    --good:#6BC495; --good-soft:#16301F; --warn:#E5A14A; --warn-soft:#33260F; --crit:#F08A82; --crit-soft:#3A1A18;
    --grid:rgba(127,176,224,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --paper:#1A2129; --ink:#E6EBF0; --muted:#9AA6B3; --line:#2C3641;
  --accent:#7FB0E0; --accent-ink:#0E1620; --accent-soft:#1E3247;
  --pencil:#F0BE3A; --pencil-soft:#352A0F;
  --good:#6BC495; --good-soft:#16301F; --warn:#E5A14A; --warn-soft:#33260F; --crit:#F08A82; --crit-soft:#3A1A18;
  --grid:rgba(127,176,224,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.num,td.n,.tile b{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.wide{width:100%}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.type{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.empty{color:var(--muted);font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.chipbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}

/* üst bar */
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line);gap:12px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand strong{font-family:var(--f-display);font-size:1.1rem;display:block;line-height:1.1}
.brand small{color:var(--muted);display:block}
.logo svg{width:34px;height:34px;display:block}
.top-r{display:flex;align-items:center;gap:10px}
.role{font-size:.85rem;color:var(--muted)}
.proto{background:var(--pencil-soft);font-size:.82rem;padding:6px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* öğretmen düzeni */
.app{min-height:100%;display:flex;flex-direction:column}
.tbody{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1}
.side{display:flex;flex-direction:column;gap:2px;padding:16px 10px;border-right:1px solid var(--line);background:var(--paper)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav:hover{background:var(--accent-soft);color:var(--ink)}
.nav.on{background:var(--accent);color:var(--accent-ink)}
.badge{background:var(--pencil);color:#1b1b1b;border-radius:999px;font-size:.75rem;padding:0 7px;min-width:20px;text-align:center}
.main{padding:24px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin-top:2px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--accent)}
.tile b{font-family:var(--f-display);font-size:1.75rem;display:block;line-height:1.15}
.tile span{font-weight:600;display:block;line-height:1.3}
.tile small{color:var(--muted)}
.tile.pen{border-top-color:var(--pencil)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0;padding-top:0}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.92rem}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;background:var(--accent-soft);border-radius:6px}
.fill{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:6px}
.fill.ok{background:var(--good)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.prog{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .g{background:var(--good)} .prog .w{background:var(--pencil)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}
.tw{overflow-x:auto}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.up{color:var(--good);font-weight:700} .down{color:var(--crit);font-weight:700}

/* görev kartları */
.task{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.task-h{display:grid;grid-template-columns:minmax(0,1fr) 240px auto;gap:16px;align-items:center;padding:12px 16px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.task-h:hover{background:var(--accent-soft)}
.chev{font-size:.85rem;font-weight:700;color:var(--accent)}
.task-b{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg);flex-wrap:wrap}
.span-all{grid-column:1/-1}

/* formlar */
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lbl{font-weight:600;font-size:.9rem}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.checks label{display:flex;gap:6px;align-items:center;font-size:.92rem}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--paper);border-radius:14px;max-width:580px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.note{background:var(--pencil-soft);border-radius:8px;padding:8px 12px;font-size:.9rem}

/* deneme girişi */
.ex input{width:54px;padding:4px 6px;text-align:right}
.ex td,.ex th{padding:6px 6px}
.ex th.dg{text-align:center;border-left:1px solid var(--line)}
.ex td.dl{border-left:1px solid var(--line)}
.ex td.bad input{border-color:var(--crit);background:var(--crit-soft)}
.ex .net{font-weight:700}
.dersset{display:flex;gap:10px;flex-wrap:wrap}
.dersset label{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 8px;border-radius:8px;font-size:.9rem}
.dersset input{width:56px;padding:4px 6px}

/* grafik */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .s0{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .a0{fill:var(--accent);opacity:.12}
.chart .s1{stroke:var(--muted);fill:none;stroke-width:1.5;stroke-dasharray:5 4}
.chart .d0{fill:var(--paper);stroke:var(--accent);stroke-width:2}
.chart .d1{fill:var(--muted)}
.chart .lb{fill:var(--ink);font-weight:700;font-size:12px;font-family:var(--f-body)}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:3px;background:var(--accent);vertical-align:middle;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px)}

/* mesajlar */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg small{display:block;color:var(--muted);font-size:.75rem}
.report{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px 14px;font-size:.92rem;margin:0;font-family:var(--f-body)}

/* giriş */
.login{min-height:100%;display:grid;place-items:center;padding:28px 16px}
.login-box{max-width:880px;width:100%;display:flex;flex-direction:column;gap:20px}
.login-box>p{max-width:62ch;color:var(--muted)}
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.err{color:var(--crit);font-size:.9rem}

/* veli */
.pmain{max-width:640px;width:100%;margin:0 auto;padding:20px 16px 104px;display:flex;flex-direction:column;gap:16px}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.bnav button{border:0;background:transparent;padding:9px 4px 11px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.bnav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav .badge{position:absolute;top:4px;right:calc(50% - 26px)}
.ptask{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);border-left:4px solid var(--pencil)}
.ptask.crit{border-left-color:var(--crit)} .ptask.warn{border-left-color:var(--warn)} .ptask.good{border-left-color:var(--good)}
.ptask-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card.streak{flex-direction:row}
.streak{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.streak b{font-family:var(--f-display);font-size:1.5rem}
.days{display:flex;gap:4px}
.days i{width:30px;height:34px;border-radius:7px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-size:.68rem;color:var(--muted);line-height:1.1}
.days i.on{background:var(--good);color:#fff}
.days i.today{outline:2px solid var(--pencil)}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.stepc{display:flex;align-items:center;gap:4px}
.stepc input{width:72px;text-align:center}
.stepc button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:1rem}
.datechips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.datechips button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.78rem;line-height:1.25;min-width:52px}
.datechips button b{font-size:1rem}
.datechips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);margin-top:2px}
.dot.off{background:transparent}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:700}
@media (max-width:760px){
  .tbody{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .nav{flex:0 0 auto}
  .task-h{grid-template-columns:1fr}
  .bar{grid-template-columns:78px minmax(0,1fr) 78px}
  .top{padding:10px 16px} .proto{padding:6px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v2 ekleri */
.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--crit-soft);border-left:4px solid var(--crit)}
.flag.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.flag .who{font-weight:700}
.card.alert{border-top:3px solid var(--crit)}
.pushkart h3{margin:0 0 4px}.pushkart{margin-bottom:12px}.notifs+.pushkart{margin-top:12px}
.modal:has(.karneler){max-width:760px}
.karne{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.karneler{display:flex;flex-direction:column;gap:16px}
.karne-h{display:flex;gap:12px;align-items:center}.karne-h .logo svg{width:36px;height:36px}.karne-h h2{margin:0;font-size:1.15rem}.karne-h p{margin:2px 0 0}
.karne h3{font-size:.95rem;margin:4px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.karne-ozet{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:0;font-weight:600}
.kt{width:100%;border-collapse:collapse}.kt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}.kt td.n{text-align:right;white-space:nowrap}
.karne-alt{margin:4px 0 0}
.kt td.n .pill{white-space:normal;display:inline-block;text-align:center;max-width:150px}
@media (max-width:520px){.karne{padding:12px}.karne-h .logo{display:none}.kt tr{display:flex;flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid var(--line)}.kt td{border:0}.kt td:first-child{flex:1 1 100%}}
@media print{
  body.karne-baski .app>*:not(.modal-bg){display:none!important}
  body.karne-baski .modal-bg{position:static!important;background:none!important;padding:0!important;display:block!important}
  body.karne-baski .modal{max-width:none!important;max-height:none!important;overflow:visible!important;border:0!important;box-shadow:none!important;padding:0!important}
  body.karne-baski .noprint{display:none!important}
  body.karne-baski{background:#fff!important}
  body.karne-baski .karne{border:0;padding:0;break-after:page;page-break-after:always;color:#000}
  body.karne-baski .karne:last-child{break-after:auto;page-break-after:auto}
  body.karne-baski .karne-ozet{background:#eef3f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.karne-baski .bar i,body.karne-baski .pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.upsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding:6px 10px;background:var(--good-soft,#e8f5ee);border-radius:8px;font-size:.9rem}
.hedefrow{display:flex;gap:8px;align-items:center}.hedefrow input{max-width:120px}.hedefrow select{max-width:140px}
.mdetay{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding:8px 10px;background:var(--bg,#f6f7f9);border-radius:8px;border:1px solid var(--line)}
.md-mik{display:flex;align-items:center;gap:8px}.mbar{flex:1;max-width:160px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--good)}
.mdetay>.pill{align-self:flex-start}.md-not{font-size:.9rem;font-style:italic}.mdetay details summary{cursor:pointer;color:var(--muted)}
.rehber summary{cursor:pointer}.rehber ul{margin:8px 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
#pm-secim .chipbtn.on{background:var(--ink,#1d2a3a);color:#fff;border-color:var(--ink,#1d2a3a)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tri button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 4px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.84rem;line-height:1.2}
.tri b{font-size:1.25rem;line-height:1}
.tri .ok{border-color:var(--good);color:var(--good)} .tri .ok:hover{background:var(--good-soft)}
.tri .half{border-color:var(--warn);color:var(--warn)} .tri .half:hover{background:var(--warn-soft)}
.tri .no{border-color:var(--crit);color:var(--crit)} .tri .no:hover{background:var(--crit-soft)}

function kayitKaydetPlanla(sid,date){
  clearTimeout(kayitZaman[date]);
  kayitZaman[date]=setTimeout(()=>kayitKaydet(sid,date),500);
}
async function kayitKaydet(sid,date){
  const l=getLog(sid,date);if(!l) return;
  const row={ogrenci_id:sid,tarih:date,sayfa:+l.sayfa||0,kitap:l.kitap||null,calismadik:!!l.calismadik,odev_yok:!!l.odevYok};
  Object.entries(DERS_SUTUN).forEach(([d,c])=>{row[c]=+(l.soru[d]||0);});
  try{
    await q(sb.from('gunluk_kayitlar').upsert(row,{onConflict:'ogrenci_id,tarih'}));
    const ders=Object.keys(l.odev||{});
    let del=sb.from('okul_odevleri').delete().eq('ogrenci_id',sid).eq('tarih',date);
    if(ders.length) del=del.not('ders','in','('+ders.map(d=>'"'+d.replace(/"/g,'')+'"').join(',')+')');
    await q(del);
    if(ders.length) await q(sb.from('okul_odevleri').upsert(ders.map(d=>({ogrenci_id:sid,tarih:date,ders:d,durum:l.odev[d]})),{onConflict:'ogrenci_id,tarih,ders'}));
    const el=document.getElementById('kayit-durum');if(el){el.textContent='✓ Kaydedildi';el.className='saved';}
  }catch(e){console.error(e);toast('Kaydedilemedi: '+hataMetni(e));await yukle();render();}
}
async function panoYukle(){
  const [f,t]=periodRange(ui.period);

    const [pano,gel,akis]=await Promise.all([q(sb.rpc('grup_panosu',{p_bas:f,p_bit:t})),q(sb.rpc('grup_gelisim_ilk3',{p_bas:f,p_bit:t})),q(sb.rpc('grup_akisi'))]);
    ui.board={p:ui.period,pano,gel,akis};
  }catch(e){console.error(e);ui.board={p:ui.period,hata:hataMetni(e),pano:[],gel:[],akis:[]};}
  render();
}

const assigned=sid=>S.tasks.filter(t=>t.targets==='all'||t.targets.includes(sid));
const studentsFor=t=>t.targets==='all'?S.students:S.students.filter(s=>t.targets.includes(s.id));
const markOf=(t,sid)=>S.marks[t.id+'|'+sid];
function statusOf(t,sid){const m=markOf(t,sid);if(m)return m.status;return t.due<TODAY?'gecikti':'bekliyor';}
const isDone=st=>st==='onay'||st==='veli_tam';
const isOpen=st=>st==='bekliyor'||st==='gecikti'||st==='eksik';
function taskStats(sid,from,to){
  let n=0,done=0,ontime=0;
  assigned(sid).forEach(t=>{
    if(t.due<from||t.due>to) return;
    const st=statusOf(t,sid);
    if(t.due>=TODAY&&!isDone(st)) return;
    n++;
    if(isDone(st)){done++;if(markOf(t,sid).at<=t.due) ontime++;}
  });
  return {n,done,ontime,pct:n?done/n:null,ontimePct:done?ontime/done:null};
}
const getLog=(sid,date)=>S.logs.find(l=>l.sid===sid&&l.date===date);
const active=l=>!!l&&!l.calismadik&&((l.sayfa||0)>0||Object.values(l.soru||{}).some(v=>v>0)||Object.values(l.odev||{}).includes('tam'));
const okulDersleri=()=>S.settings.okulDersleri||OKUL_DERS;
function odevSum(sid,from,to){
  const o={gun:0,top:0,tam:0,eksik:0,yok:0,ders:{}};
  S.logs.forEach(l=>{
    if(l.sid!==sid||l.date<from||l.date>to) return;
    const e=Object.entries(l.odev||{}).filter(([d,v])=>v!=='yoktu');if(e.length)o.gun++;
    e.forEach(([d,v])=>{o.top++;o[v]++;const x=o.ders[d]=o.ders[d]||{top:0,tam:0,eksik:0,yok:0};x.top++;x[v]++;});
  });
  o.pct=o.top?o.tam/o.top:null;return o;
}

function scriptYukle(src){return _scr[src]=_scr[src]||new Promise((ok,no)=>{const t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=()=>{delete _scr[src];no(new Error('Kütüphane yüklenemedi; internet bağlantısını kontrol edin.'));};document.head.appendChild(t);});}
async function pdfKutuphaneleri(pdfGerekli){
  await scriptYukle('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js');
  if(pdfGerekli){await scriptYukle('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';}

/* Sayfaları en fazla ~1600 piksel genişlikte JPEG'e çevirip yeni bir PDF kurar. */
function kanvasKucult(w,h){const sc=Math.min(1,1600/Math.max(w,1));return [Math.max(1,Math.round(w*sc)),Math.max(1,Math.round(h*sc))];}
async function sayfalardanPdf(sayfaSayisi,ciz,bilgi){
  const {jsPDF}=window.jspdf;let doc=null;
  for(let i=1;i<=sayfaSayisi;i++){
    bilgi('Küçültülüyor… sayfa '+i+'/'+sayfaSayisi);
    const {cv,wPt,hPt}=await ciz(i);
    const jpg=cv.toDataURL('image/jpeg',0.72);
    const or=wPt>hPt?'l':'p';
    if(!doc) doc=new jsPDF({orientation:or,unit:'pt',format:[wPt,hPt],compress:true}); else doc.addPage([wPt,hPt],or);
    doc.addImage(jpg,'JPEG',0,0,wPt,hPt,undefined,'FAST');
    cv.width=cv.height=0;
  }
  return doc.output('blob');
}
function sureli(p,ms,msg){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error(msg+' (zaman aşımı)')),ms))]);}
async function dosyaHazirla(files,bilgi){
  const f0=files[0];
  if(/pdf/i.test(f0.type)||/\.pdf$/i.test(f0.name)){
    if(f0.size<=KUCULT_ESIK) return f0;
    bilgi('Dosya büyük ('+mb(f0.size)+'), küçültülüyor…');
    await pdfKutuphaneleri(true);
    const pdf=await sureli(window.pdfjsLib.getDocument({data:await f0.arrayBuffer()}).promise,60000,'PDF açılamadı');
    const out=await sayfalardanPdf(pdf.numPages,async i=>{
      const pg=await pdf.getPage(i),v1=pg.getViewport({scale:1});
      const [w,h]=kanvasKucult(v1.width*2.2,v1.height*2.2),vp=pg.getViewport({scale:w/v1.width});
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);
      await sureli(pg.render({canvasContext:cx,viewport:vp,intent:'print'}).promise,90000,'Sayfa '+i+' işlenemedi');pg.cleanup();
      return {cv,wPt:v1.width,hPt:v1.height};
    },bilgi);
    pdf.destroy();
    return out.size<f0.size?out:f0;
  }
  await pdfKutuphaneleri(false);
  return sayfalardanPdf(files.length,async i=>{
    const bmp=await createImageBitmap(files[i-1]);
    const [w,h]=kanvasKucult(bmp.width,bmp.height);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(bmp,0,0,w,h);bmp.close&&bmp.close();
    const wPt=595.28,hPt=wPt*h/w;  /* A4 genişliği */
    return {cv,wPt,hPt};
  },bilgi);
}

function logSum(sid,from,to){
  const o={soru:{},soruT:0,sayfa:0,days:0,kitaplar:new Set()};
  S.logs.forEach(l=>{
    if(l.sid!==sid||l.date<from||l.date>to) return;
    if(active(l)) o.days++;
    Object.entries(l.soru||{}).forEach(([d,n])=>{o.soru[d]=(o.soru[d]||0)+n;o.soruT+=n;});
    o.sayfa+=l.sayfa||0;
    if(l.kitap&&l.sayfa) o.kitaplar.add(l.kitap);
  });
  return o;
}
const inMazeret=(sid,date)=>S.durum.some(d=>d.sid===sid&&d.pause&&date>=d.from&&date<=d.to);
function countable(sid,date){if(!S.settings.haftasonuSay&&isWeekend(date))return false;return !inMazeret(sid,date);}
function missing(sid){
  const s=stu(sid);let n=0,d=addDays(TODAY,-1);
  for(let g=0;g<40;g++){
    if(s.activeSince&&d<s.activeSince) break;
    if(d<S.settings.donemBas) break;
    if(countable(sid,d)){if(getLog(sid,d)) break;n++;}
    d=addDays(d,-1);
  }
  return n;
}
const suspended=sid=>{const s=stu(sid);return !!(s&&s.askida);};
function streak(sid){
  let n=0,d=TODAY;
  if(active(getLog(sid,d))) n++;
  d=addDays(d,-1);
  for(let g=0;g<200;g++){
    if(active(getLog(sid,d))) n++;
    else if(countable(sid,d)) break;
    d=addDays(d,-1);
  }
  return n;
}
function maxStreak(sid,from,to){
  let cur=0,best=0;
  for(let d=from;d<=to;d=addDays(d,1)){
    if(active(getLog(sid,d))){cur++;best=Math.max(best,cur);}
    else if(countable(sid,d)&&d<TODAY) cur=0;
  }
  return best;
}
const netOf=(d,y)=>{const r=+S.settings.netRule;return r?d-y/r:d;};
const examsSorted=()=>[...S.exams].sort((a,b)=>a.date.localeCompare(b.date));
function examNet(e,sid,ders){
  const res=e.results[sid];if(!res)return null;
  if(ders&&ders!=='Toplam'){const x=res[ders];return x?netOf(x.d,x.y):null;}
  let t=0,any=false;e.dersler.forEach(dd=>{const x=res[dd.ad];if(x){t+=netOf(x.d,x.y);any=true;}});return any?t:null;
}
function groupAvg(e,ders){const v=S.students.map(s=>examNet(e,s.id,ders)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}

function niceStep(range){const raw=range/4;const mag=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*mag>=raw)return m*mag;}return 10*mag;}
function lineChart(series,labels){
  const W=600,H=230,pl=40,pr=56,pt=16,pb=32;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null));
  if(!all.length) return '<p class="empty">Henüz deneme sonucu yok.</p>';
  let lo=Math.min(...all),hi=Math.max(...all);
  const step=niceStep(Math.max(hi-lo,4));lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const X=i=>labels.length===1?pl+(W-pl-pr)/2:pl+(W-pl-pr)*i/(labels.length-1);
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${nf(v,1)}</text>`;}
  labels.forEach((l,i)=>{g+=`<text class="ax" x="${X(i)}" y="${H-10}" text-anchor="middle">${esc(l)}</text>`;});
  series.forEach((s,si)=>{
    const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(si===0&&pts.length>1) g+=`<path class="a0" d="${d} L${pts[pts.length-1][0]} ${H-pb} L${pts[0][0]} ${H-pb} Z"/>`;
    g+=`<path class="s${si}" d="${d}"/>`;
    pts.forEach((p,i)=>{g+=`<circle class="d${si}" cx="${p[0]}" cy="${p[1]}" r="${si===0?(i===pts.length-1?5:3.5):2.5}"/>`;});
    const lv=s.vals.filter(v=>v!=null).slice(-1)[0],lp=pts[pts.length-1];
    g+=`<text class="${si===0?'lb':'ax'}" x="${lp[0]+9}" y="${lp[1]+(si===0?-6:12)}">${nf(lv,1)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Deneme net grafiği">${g}</svg></div>`;
}

  const bits=[];

  else if(m.yapilan!=null) bits.push(`<div class="md-mik"><strong>${m.yapilan}</strong> yapıldı</div>`);
  if(m.secim) bits.push(`<span class="pill ${m.secim==='kendi'?'good':m.secim==='yardim'?'neutral':'warn'}">${SECIM[m.secim]}</span>`);
  if(m.vnote) bits.push(`<div class="md-not">Veli: “${esc(m.vnote)}”</div>`);
  const son=(m.at<t.due?m.at:t.due)>TODAY?TODAY:(m.at<t.due?m.at:t.due),ls=logSum(sid,t.given,son);
  let bag='';
  if(t.type==='kitap'||t.ders==='Okuma') bag=ls.sayfa?`Günlük kayıtta bu sürede ${ls.sayfa} sayfa okuma${ls.kitaplar.size?' · '+[...ls.kitaplar].map(esc).join(', '):''}`:'Günlük kayıtta bu sürede okuma girilmemiş';

async function oturumAc(){

      if(yi){const v=yi.value.trim();
        if(v!==''){const n=Math.round(+v);if(!(n>=0&&n<=10000)){err.textContent='Geçerli bir sayı yazın.';return;}alan.yapilan=n;}
        else if(mm.st==='veli_eksik'){err.textContent='Kaç '+BIRIM[t.birim]+' yapıldığını yazın.';return;}}
      const sb_=document.querySelector('#pm-secim button.on');if(sb_)alan.veli_secim=sb_.dataset.v;
      const nt=document.getElementById('pm-not').value.trim();if(nt)alan.veli_notu=nt.slice(0,300);
      ui.modal=null;
      return yaz(()=>isaretYaz(mm.key,alan),mm.st==='veli_tam'?'İşaretlendi; öğretmen kontrolüne gitti':'İşaretlendi; öğretmen bilgilendirilecek');}
    case 'punmark':{const [g,o]=k.split('|');return yaz(()=>q(sb.from('isaretler').delete().eq('gorev_id',g).eq('ogrenci_id',o)),'İşaret geri alındı');}
    case 'logdate': ui.logDate=el.dataset.v;break;
    case 'q':{if(suspended(ui.sid))return;const d=el.dataset.d,n=+el.dataset.n,bk=document.getElementById('lg-book');
      setLogLocal(ui.sid,ui.logDate,l=>{l.calismadik=false;if(bk&&bk.value.trim()&&!l.kitap)l.kitap=bk.value.trim();if(d==='sayfa')l.sayfa=n;else if(n)l.soru[d]=n;else delete l.soru[d];});break;}
    case 'odv':{if(suspended(ui.sid))return;const d=el.dataset.d,v=el.dataset.v;setLogLocal(ui.sid,ui.logDate,l=>{l.calismadik=false;l.odev=l.odev||{};if(l.odev[d]===v)delete l.odev[d];else l.odev[d]=v;l.odevYok=false;});break;}
    case 'odvyok':{if(suspended(ui.sid))return;setLogLocal(ui.sid,ui.logDate,l=>{l.odev={};l.odevYok=!l.odevYok;});break;}
    case 'likeprev':{
      const prev=getLog(ui.sid,addDays(ui.logDate,-1));if(!prev||prev.calismadik){toast('Önceki gün için kopyalanacak kayıt yok');return;}
      setLogLocal(ui.sid,ui.logDate,l=>{l.calismadik=false;l.soru=Object.assign({},prev.soru);l.sayfa=prev.sayfa;l.kitap=prev.kitap;});toast('Önceki günün kaydı kopyalandı');break;}
    case 'nostudy':{setLogLocal(ui.sid,ui.logDate,l=>{l.soru={};l.sayfa=0;l.calismadik=true;});toast('“Çalışmadık” kaydı girildi');break;}
    case 'durum': ui.modal={type:'durum'};break;
    case 'savedurum':{
      const type=document.querySelector('input[name="du-t"]:checked').value,[f,t]=document.getElementById('du-r').value.split(',').map(Number),x=document.getElementById('du-x').value.trim();
      ui.modal=null;return yaz(()=>q(sb.from('durum_bildirimleri').insert({ogrenci_id:ui.sid,tur:type,bas:addDays(TODAY,f),bit:addDays(TODAY,t),aciklama:x||null})),'Öğretmene iletildi');}
    default: return;
  }
  render();
});
function setLogLocal(sid,date,fn){
  let l=getLog(sid,date);
  if(!l){l={sid,date,soru:{},sayfa:0,kitap:lastBook(sid),odev:{},odevYok:false,calismadik:false};S.logs.push(l);}
  fn(l);kayitKaydetPlanla(sid,date);
}
document.addEventListener('input',e=>{
  const el=e.target,a=el.dataset&&el.dataset.a;if(!a)return;
  if(a==='exin'){
    const dr=ui.draft,sid=el.dataset.s,d=el.dataset.d,kk=el.dataset.k;
    dr.results[sid]=dr.results[sid]||{};dr.results[sid][d]=dr.results[sid][d]||{d:'',y:''};
    dr.results[sid][d][kk]=el.value===''?'':Math.max(0,parseInt(el.value,10)||0);
    const x=dr.results[sid][d],ds=dr.dersler.find(z=>z.ad===d),bad=(+x.d||0)+(+x.y||0)>ds.soru;
    const td=el.closest('td'),pair=kk==='d'?td.nextElementSibling:td.previousElementSibling;
    td.classList.toggle('bad',bad);pair.classList.toggle('bad',bad);
    let t=0,any=false;dr.dersler.forEach(z=>{const qq=(dr.results[sid]||{})[z.ad];if(qq&&(qq.d!==''||qq.y!=='')){t+=netOf(+qq.d||0,+qq.y||0);any=true;}});
    document.getElementById('net-'+sid).textContent=any?nf(t):'—';
  }else if(a==='exmeta'){ui.draft[el.dataset.k]=el.value;}
  else if(a==='eval'){
    const sid=el.dataset.s;S.evals[sid]=el.value;const r=document.getElementById('rep');if(r)r.textContent=reportText(sid);
    clearTimeout(evTimers[sid]);evTimers[sid]=setTimeout(()=>{sb.from('degerlendirmeler').upsert({ogrenci_id:sid,donem:'donem',metin:S.evals[sid]},{onConflict:'ogrenci_id,donem'}).then(({error})=>{if(error)toast('Değerlendirme kaydedilemedi');});},800);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='up-file'){ui.upPick=0;if(el.files&&el.files.length){ui.upFiles=[...el.files];const s_=document.getElementById('up-sel');if(s_)s_.innerHTML=secilenHtml();const er=document.getElementById('up-err');if(er)er.textContent='';}return;}
  const a=el.dataset&&el.dataset.a;if(!a)return;
  if(a==='tgmode'){document.getElementById('nt-checks').hidden=el.value!=='sel';}
  else if(a==='upmode'){document.getElementById('up-checks').hidden=el.value!=='sel';}
  else if(a==='exsoru'){ui.draft.dersler[+el.dataset.i].soru=Math.max(0,parseInt(el.value,10)||0);render();}
  else if(a==='set'||a==='setb'||a==='target'){
    const st=JSON.parse(JSON.stringify(S.settings)),kk=el.dataset.k;
    if(a==='set') st[kk]=(kk==='netRule'||kk==='okumaHedef')?(+el.value||0):el.value;
    else if(a==='setb') st[kk]=el.checked;
    else st.targets[el.dataset.d]=Math.max(0,+el.value||0);
    const upd={ayarlar:ayarlarYaz(st)};
    if(kk==='className') upd.ad=st.className||'Grup';
    if(kk==='donemBas') upd.donem_bas=st.donemBas;
    if(kk==='yilBas') upd.yil_bas=st.yilBas;
    yaz(()=>q(sb.from('gruplar').update(upd).eq('id',G.id)),'Kaydedildi');
  }
  else if(a==='vis'){yaz(()=>q(sb.from('ogrenciler').update({gorunur:el.checked}).eq('id',el.dataset.s)),'İzin güncellendi');}
  else if(a==='qin'){if(suspended(ui.sid))return;const d=el.dataset.d,v=Math.max(0,parseInt(el.value,10)||0);setLogLocal(ui.sid,ui.logDate,l=>{l.calismadik=false;if(d==='sayfa')l.sayfa=v;else if(v)l.soru[d]=v;else delete l.soru[d];});render();}
  else if(a==='qbook'){if(suspended(ui.sid))return;const v=el.value.trim(),l=getLog(ui.sid,ui.logDate);if(!l){toast('Kitap adı, sayfa sayısını seçince kaydedilir');return;}l.kitap=v;kayitKaydetPlanla(ui.sid,ui.logDate);toast('Kitap kaydedildi');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}});
/* Uygulamaya geri dönülünce verileri tazele (öğretmen yeni işaretleri görsün) */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&ui.role&&!ui.modal&&!ui.draft&&!ui.busy&&!(ui.upFiles&&ui.upFiles.length)&&!(ui.upPick&&Date.now()-ui.upPick<600000)){yukle().then(render).catch(()=>{});}
});

/* ---------- telefona bildirim (Web Push) ---------- */
const PUSH_DESTEK=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window)&&(location.protocol==='https:'||location.hostname==='localhost');
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
let swKayit=null;
function b64uBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function bildirimFonk(islem){
  const {data,error}=await sb.functions.invoke('bildirim-gonder',{body:{islem}});
  if(error){let m=error.message;try{const b=await error.context.json();m=b.hata||m;}catch(_){}throw new Error(m);}
  if(data&&data.hata) throw new Error(data.hata);
  return data;
}
async function pushDurumu(){
  if(!PUSH_DESTEK){ui.push=IOS&&!STANDALONE?'ios':'yok';return;}
  try{
    swKayit=swKayit||await navigator.serviceWorker.register('sw.js');
    if(Notification.permission==='denied'){ui.push='engelli';return;}
    const ab=await swKayit.pushManager.getSubscription();
    if(ab){ui.push='acik';
      /* aynı cihazda başka kullanıcı girmişse aboneliği bu kullanıcıya taşı */
      const j=ab.toJSON();sb.rpc('push_abone_ol',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_cihaz:cihazAdi()}).then(()=>{});
    }else ui.push='kapali';
  }catch(e){console.error(e);ui.push='yok';}
}
function cihazAdi(){const u=navigator.userAgent;return (/Android/.test(u)?'Android':IOS?'iPhone/iPad':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Cihaz')+' · '+(/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'Tarayıcı');}
async function pushAc(){
  const izin=await Notification.requestPermission();
  if(izin!=='granted'){ui.push=izin==='denied'?'engelli':'kapali';throw new Error('Bildirim izni verilmedi.');}
  swKayit=swKayit||await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const {anahtar}=await bildirimFonk('anahtar');
  let ab=await swKayit.pushManager.getSubscription();
  if(!ab) ab=await swKayit.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(anahtar)});
  const j=ab.toJSON();
  await q(sb.rpc('push_abone_ol',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_cihaz:cihazAdi()}));
  ui.push='acik';
}
async function pushKapat(){
  const ab=swKayit&&await swKayit.pushManager.getSubscription();
  if(ab){await q(sb.rpc('push_abonelik_sil',{p_endpoint:ab.endpoint}));await ab.unsubscribe();}
  ui.push='kapali';
}
function pushKarti(yer){
  const p=ui.push,veli=ui.role==='v';
  const ne=veli?'akşam hatırlatması, yeni görev, deneme sonucu ve öğretmen notları':'her akşamki günlük özet';
  let ic='';
  if(p==='acik') ic=`<p class="small"><strong>✓ Bu cihazda bildirimler açık.</strong> ${ne[0].toUpperCase()+ne.slice(1)} telefonunuza gelir.</p><div class="row-btns"><button class="btn sm" data-a="pushdeneme">Deneme bildirimi gönder</button><button class="btn sm ghost" data-a="pushkapat">Bu cihazda kapat</button></div>`;
  else if(p==='kapali') ic=`<p class="small">Uygulama kapalıyken de ${ne} telefonunuza gelsin.</p><div class="row-btns"><button class="btn sm pri" data-a="pushac">Bildirimleri aç</button>${yer==='banner'?'<button class="btn sm ghost" data-a="pushsonra">Şimdi değil</button>':''}</div>`;
  else if(p==='ios') ic=`<p class="small"><strong>iPhone’da bildirim için önce uygulamayı ana ekrana ekleyin:</strong> Safari’de alttaki <b>Paylaş</b> düğmesine (kare ve yukarı ok) dokunun → <b>Ana Ekrana Ekle</b>. Sonra Takip Defteri’ni ana ekrandaki simgeden açıp buradan “Bildirimleri aç”a dokunun. (iOS 16.4 ve üstü gerekir.)</p>`;
  else if(p==='engelli') ic=`<p class="small">Bildirimler bu tarayıcıda engellenmiş. Adres çubuğundaki kilit simgesine dokunup <b>Bildirimler → İzin ver</b> seçin, sonra sayfayı yenileyin.</p>`;
  else if(p==='yok') ic=`<p class="small muted">Bu tarayıcı telefona bildirim göndermeyi desteklemiyor. Android’de Chrome, iPhone’da ana ekrana eklenmiş uygulama kullanın.</p>`;
  else return '';
  return `<div class="pushkart${yer==='banner'?' banner info':''}">${yer==='banner'?'':'<h3>Telefona bildirim</h3>'}${ic}</div>`;
}
function hedefeGit(h){
  h=h||'bugun';
  if(ui.role==='v'){goTop(()=>{ui.pview=['bugun','gelisim','grup','dosyalar','notlar'].includes(h)?h:'bugun';ui.modal=null;});if(ui.pview==='grup')panoYukle();}
  else goTop(()=>{ui.view=['pano','kontrol','gorevler','ogrenciler','denemeler','dosyalar','notlar','ayarlar'].includes(h)?h:'pano';ui.profile=null;ui.modal=null;});
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.tur==='bildirim-ac'&&ui.role){yukle().then(()=>hedefeGit(e.data.hedef)).catch(()=>{});}});

(async function basla(){
  if(!window.supabase){app.innerHTML='<div class="login"><div class="login-box"><section class="card"><h2>Bağlantı kurulamadı</h2><p class="muted">İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p></section></div></div>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(session) await oturumAc(); else render();
})();

})();
